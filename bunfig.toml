[install]
# Supply-chain guard: install only versions that have been public for at least three days; our own packages are
# exempt, so a fresh prerelease of our libraries installs right away.
minimumReleaseAge = 259200
minimumReleaseAgeExcludes = ["@viamedici-spc/configurator-ts", "@viamedici-spc/fp-ts-extensions"]
